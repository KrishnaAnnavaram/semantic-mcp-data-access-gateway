[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-backend"
version = "0.1.0"
description = "Quant agent, knowledge retrieval and the /chat service"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.69.0", "qdrant-client[fastembed]>=1.12", "fastapi>=0.110", "uvicorn[standard]>=0.29", "mcp-servers"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]
