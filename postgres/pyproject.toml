[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treasury-db"
version = "0.1.0"
description = "Treasury schema, migrations and loader for semantic-mcp-data-access-gateway"
requires-python = ">=3.11"
dependencies = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["treasury_db*"]
