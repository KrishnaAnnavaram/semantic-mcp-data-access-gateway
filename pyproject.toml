# Workspace configuration for semantic-mcp-data-access-gateway.
#
# This file intentionally declares NO [project] table — the repository is not a
# single distribution. It is three, each with its own pyproject.toml:
#
#   src/postgres/   treasury-db      schema, migrations, loader, DB access
#   src/mcp/        mcp-servers      the two stdio servers and the host
#   src/backend/    gateway-backend  quant agent, knowledge retrieval, /chat API
#
# Install all three for development:
#
#   pip install -r requirements.txt
#   pip install -e ./postgres -e ./mcp -e ./backend
#
# The frontend is a React (npm) app, run in place, with its own test suite.

[tool.pytest.ini_options]
# Root `pytest` runs the cross-tier integration suite only. The frontend is not
# a Python package and has its own test runner: `cd frontend && npm test`.
testpaths = ["tests"]
pythonpath = ["postgres/src", "mcp/src", "backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["adaptive-legacy-code-complexity-harness", "data/raw", "data/processed"]
