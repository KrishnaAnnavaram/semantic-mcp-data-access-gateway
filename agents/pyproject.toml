[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-agents"
version = "0.1.0"
description = "The three runtime agents: orchestrator, domain expert, MCP agent"
requires-python = ">=3.11"
dependencies = [
    # Agents reach models only through the seam; no vendor SDK is named here.
    "gateway-llm",
    "langsmith>=0.1",
    # A2A: the official SDK. 1.x is the first line implementing protocol 1.0
    # with the proto-derived types, the task lifecycle and the JSON-RPC/REST
    # server bindings this package mounts; 0.3.x is a different type system.
    "a2a-sdk>=1.1.2",
    # The transport A2A rides on. Starlette hosts each agent's endpoint; httpx
    # dials it, in-process or over a socket, with no change in the client code.
    "httpx>=0.27",
    "starlette>=0.37",
]

# Deliberately flat and at the repository root. These are the components a
# reader is looking for when they ask "where are the agents?", and burying them
# three directories inside another distribution answers that question badly.
[tool.setuptools]
# `agents.a2a` is listed explicitly: the protocol boundary is a subpackage of
# the agents distribution rather than a distribution of its own, because it has
# no life apart from the three agents it carries.
packages = ["agents", "agents.a2a"]
package-dir = { "agents" = "." }
